<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bob's Run</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--btn:#fff;--bd:#cfc8b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--fg:#ecebe6;--btn:#2a2a27;--bd:#3d3d39}}
:root[data-theme="dark"]{--bg:#151513;--fg:#ecebe6;--btn:#2a2a27;--bd:#3d3d39}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px;text-align:center}
.wrap{position:relative}
canvas{width:100%;display:block;border-radius:8px;image-rendering:pixelated;touch-action:none}
#msg,#shop,#mus{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;font-weight:600;padding:16px;line-height:1.6}
.mb{display:flex;flex-direction:column;gap:8px;min-width:180px}
button{font:inherit;border:1px solid var(--bd);background:var(--btn);color:var(--fg);border-radius:10px;padding:10px 14px;touch-action:none;user-select:none}
button:disabled{opacity:.4}
.pad,.bar{display:flex;gap:8px;margin-top:10px}
.pad button{flex:1;height:56px;font-size:1.1rem}
.bar button{flex:1;padding:8px}
.hint{font-size:.8rem;opacity:.7;margin-top:8px}
</style>
</head>
<body>
<main>
<div class="wrap"><canvas id="c" width="640" height="480"></canvas>
<div id="msg"><div id="mt"></div><div class="mb"><button id="bn">New Game</button><button id="bc">Continue</button></div></div><div id="shop" style="display:none"></div><div id="mus" style="display:none"></div></div>
<div class="pad"><button id="bl">◀</button><button id="br">▶</button><button id="bj">JUMP</button><button id="bf">FIRE</button><button id="bd">▼</button><button id="bi">ITEM</button></div>
<div class="bar"><button id="ts">💾 Save</button><button id="tl">📂 Load</button><button id="tp">🛒 Shop</button><button id="tu">🔭 Museum</button><button id="tm">☰ Menu</button></div>
<div class="hint">Arrows/A-D move · Space/W/↑ jump · F fire/claw · S crouch · E use stored item · Bump brown blocks from below to smash them, gold blocks hold power-ups</div>
</main>

  if(st==='bwin'){const s=Math.min(1,fa*2);txt('BOSS DEFEATED!',VW/2,150,24+16*s,'#ffd23f');if(fa>1.2)txt(lv===LV.length-1?'You saved the galaxy!':'World '+((lv>>2)+1)+' clear!',VW/2,196,24)}
  if(st==='fade'){ctx.fillStyle='rgba(0,0,0,'+Math.min(1,fa)+')';ctx.fillRect(0,0,VW,VH)}
}

let last=0;function frame(t){const dt=Math.min((t-last)/1000,.033);last=t;toastT-=dt;update(dt);draw();if(toastT>0)txt(toastS,VW/2,70,20);requestAnimationFrame(frame)}
const km={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',w:'jump',' ':'jump',Enter:'jump',f:'fire',s:'down',ArrowDown:'down',e:'item'};
addEventListener('keydown',e=>{const k=km[e.key.length>1?e.key:e.key.toLowerCase()];if(!k)return;e.preventDefault();
  if(st==='gameover'){if(!e.repeat&&k==='jump')goOver();return}
  if(st==='map'){if(!e.repeat&&k!=='fire')mapKey(k);return}
  if(k==='fire'){if(!e.repeat)shoot();return}
  if(k==='item'){if(!e.repeat)useItem();return}
  if(k==='jump'&&!keys.jump)jumpBuf=.1;keys[k]=1});
addEventListener('keyup',e=>{const k=km[e.key.length>1?e.key:e.key.toLowerCase()];if(k)keys[k]=0});
[['bl','left'],['br','right'],['bj','jump'],['bf','fire'],['bd','down'],['bi','item']].forEach(([id,k])=>{const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='gameover'){if(k==='jump')goOver();return}if(st==='map'){if(k!=='fire')mapKey(k);return}if(k==='fire')return shoot();if(k==='item')return useItem();if(k==='jump'&&!keys.jump)jumpBuf=.1;keys[k]=1});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{if(k!=='fire')keys[k]=0}))});
const musEl=document.getElementById('mus');let ms=0;
function renderMus(){const n=have.filter(Boolean).length;
  musEl.innerHTML=`<div style='font-size:20px'>🔭 Cosmos Museum · ${n}/${COL.length}</div><div id='mi' style='min-height:64px;max-width:340px;font-size:14px;font-weight:500'></div><div id='mg' style='display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(440px,92%)'></div><button style='min-width:120px'>Close</button>`;
  const g=musEl.querySelector('#mg');
  COL.forEach((c,i)=>{const d=document.createElement('div');d.style.cssText='background:#0b0f24;border:2px solid '+(i===ms?'#ffd23f':'#334')+';border-radius:6px;cursor:pointer';
    const k=mkBody(i,44);k.style.cssText='width:100%;display:block'+(have[i]?'':';filter:brightness(0) opacity(.5)');d.appendChild(k);d.onclick=()=>{ms=i;renderMus()};g.appendChild(d)});
  const c=COL[ms];musEl.querySelector('#mi').innerHTML=have[ms]?`<b>${c[0]}</b> · ${c[1]}<br>${c[2]}`:`<b>???</b><br>Hidden inside a brown block in level ${LV[ms].n.trim()}.`}
musEl.onclick=e=>{if(e.target.closest('button'))musEl.style.display='none'};
document.getElementById('tu').onclick=()=>{renderMus();musEl.style.display='flex'};
function mapKey(k){if(k==='left')sel=Math.max(0,sel-1);else if(k==='right')sel=Math.min(mxl(),sel+1);else if(k==='jump')startLevel(sel)}
cv.addEventListener('pointerdown',e=>{if(st==='gameover')return goOver();if(st!=='map')return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*VW/r.width,y=(e.clientY-r.top)*VH/r.height;
  for(let j=0;j<4;j++){const[nx,ny]=nodePos(j),i=(sel>>2)*4+j;if(Math.hypot(x-nx,y-ny)<32&&i<=mxl()){if(sel===i)startLevel(i);else sel=i}}});
requestAnimationFrame(frame);
</script>
